<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Aeniikoo Voice Maker Ultra Premium</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:linear-gradient(135deg,#fdf4ff,#f3e8ff,#ede9fe);
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
padding:20px;
}

.glass{
background:rgba(255,255,255,0.25);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.3);
box-shadow:0 10px 40px rgba(168,85,247,.2);
}

.sakura{
position:fixed;
top:-20px;
font-size:20px;
animation:fall linear infinite;
z-index:0;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
}
}

.wave span{
display:inline-block;
width:8px;
height:45px;
margin:0 3px;
background:#c084fc;
border-radius:20px;
animation:wave 1s infinite;
}

.wave span:nth-child(2){
animation-delay:.2s;
}

.wave span:nth-child(3){
animation-delay:.4s;
}

.wave span:nth-child(4){
animation-delay:.6s;
}

@keyframes wave{
0%,100%{
transform:scaleY(1);
}
50%{
transform:scaleY(1.8);
}
}

textarea{
resize:none;
}

.glow{
box-shadow:0 0 25px rgba(192,132,252,.6);
}

</style>

</head>

<body>

<script>

for(let i=0;i<30;i++){

const sakura=document.createElement("div");

sakura.innerHTML="🌸";

sakura.classList.add("sakura");

sakura.style.left=Math.random()*100+"vw";

sakura.style.animationDuration=(5+Math.random()*10)+"s";

sakura.style.opacity=Math.random();

document.body.appendChild(sakura);

}

</script>

<div class="glass glow rounded-[35px] p-8 w-full max-w-3xl relative z-10">

<h1 class="text-5xl font-bold text-center text-purple-700">
🎙️ Aeniikoo Voice Maker
</h1>

<p class="text-center text-purple-400 mt-2">
Ultra Premium Voice Generator
</p>

<div class="flex justify-center mt-6">

<div class="wave">
<span></span>
<span></span>
<span></span>
<span></span>
</div>

</div>

<textarea
id="text"
placeholder="Tulis script voice over premium..."
class="w-full h-56 mt-8 p-5 rounded-3xl bg-white/40 outline-none text-purple-700 text-lg"
></textarea>

<div class="flex justify-between mt-2 text-purple-500 text-sm">
<span id="charCount">0 karakter</span>
<span>AI Natural Voice</span>
</div>

<div class="grid md:grid-cols-2 gap-4 mt-6">

<select
id="voiceSelect"
class="p-4 rounded-2xl bg-white/50 text-purple-700 outline-none">

<option value="">Pilih Voice</option>

</select>

<select
id="speed"
class="p-4 rounded-2xl bg-white/50 text-purple-700 outline-none">

<option value="0.8">Slow</option>
<option value="1" selected>Normal</option>
<option value="1.2">Fast</option>
<option value="1.5">Ultra Fast</option>

</select>

</div>

<div class="grid md:grid-cols-2 gap-4 mt-6">

<button
onclick="generateVoice()"
class="bg-purple-500 hover:bg-purple-600 transition text-white py-4 rounded-2xl text-lg font-semibold">

🎙️ Generate Voice

</button>

<button
onclick="stopVoice()"
class="bg-pink-500 hover:bg-pink-600 transition text-white py-4 rounded-2xl text-lg font-semibold">

⏹ Stop Voice

</button>

</div>

<button
onclick="downloadAudio()"
class="w-full mt-4 bg-gradient-to-r from-pink-500 to-purple-500 hover:scale-105 transition text-white py-4 rounded-2xl text-lg font-bold">

⬇ Download Audio

</button>

</div>

<script>

const text=document.getElementById("text");
const charCount=document.getElementById("charCount");

text.addEventListener("input",()=>{

charCount.innerText=text.value.length+" karakter";

});

let voices=[];

function loadVoices(){

voices=speechSynthesis.getVoices();

const voiceSelect=document.getElementById("voiceSelect");

voiceSelect.innerHTML='';

voices.forEach((voice,index)=>{

const option=document.createElement("option");

option.value=index;

option.innerText=voice.name+" ("+voice.lang+")";

voiceSelect.appendChild(option);

});

}

speechSynthesis.onvoiceschanged=loadVoices;

loadVoices();

function generateVoice(){

const textValue=text.value;

if(!textValue){

alert("Tulis script dulu ✨");

return;

}

const speech=new SpeechSynthesisUtterance(textValue);

const selectedVoice=document.getElementById("voiceSelect").value;

speech.voice=voices[selectedVoice];

speech.rate=document.getElementById("speed").value;

speech.pitch=1;

speech.volume=1;

speechSynthesis.speak(speech);

}

function stopVoice(){

speechSynthesis.cancel();

}

function downloadAudio(){

alert("Fitur download MP3 membutuhkan Node.js server premium 🎧");

}

</script>

</body>
</html>
