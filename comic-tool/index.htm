<script>

function generatePrompt(){

let story =
document.getElementById("storyInput").value;

let style =
document.getElementById("styleSelect").value;

let scenes = createScenes(story);

let finalPrompt = "";

scenes.forEach((scene, index)=>{

finalPrompt += `
========================
SCENE ${index + 1}
========================

Ultra detailed ${style} cinematic comic illustration.

Story Scene:
${scene}

Visual Description:
beautiful emotional storytelling,
highly expressive character,
cinematic movie composition,
professional illustration,
dynamic camera angle,
detailed environment,
dreamy atmosphere,
golden hour lighting,
soft volumetric light,
depth of field,
realistic shadow,
immersive composition,
award winning artwork,
viral pinterest aesthetic,
trending tiktok style,
masterpiece quality,
8k ultra hd.

Character Details:
- expressive eyes
- emotional face
- realistic pose
- cinematic interaction
- detailed clothes
- realistic hair

Environment:
- atmospheric background
- realistic perspective
- detailed sky
- cinematic scenery
- aesthetic environment
- environmental storytelling

Camera:
close up shot,
wide cinematic angle,
movie composition,
bokeh,
depth of field.

Lighting:
golden hour,
warm cinematic light,
ambient glow,
soft shadow.

Negative Prompt:
low quality,
bad anatomy,
ugly face,
extra fingers,
watermark,
cropped,
duplicate character,
distorted body,
bad lighting,
messy composition.

`;

});

document.getElementById("output").innerText =
finalPrompt;

}

function createScenes(story){

let words = story.split(" ");

let scenes = [];

let currentScene = "";

words.forEach((word, index)=>{

currentScene += word + " ";

if((index + 1) % 12 === 0){

scenes.push(currentScene);

currentScene = "";

}

});

if(currentScene !== ""){

scenes.push(currentScene);

}

return scenes;

}

function copyPrompt(){

let text =
document.getElementById("output").innerText;

navigator.clipboard.writeText(text);

alert("Prompt berhasil dicopy!");

}

function editPrompt(){

let current =
document.getElementById("output").innerText;

let edited =
prompt("Edit prompt:", current);

if(edited !== null){

document.getElementById("output").innerText =
edited;

}

}

function deletePrompt(){

document.getElementById("output").innerText = "";

}

function generateImage(){

let prompt =
document.getElementById("output").innerText;

if(prompt.trim() === ""){

alert("Generate prompt dulu!");

return;

}

let encoded =
encodeURIComponent(prompt);

window.open(
"https://www.bing.com/images/create?q=" + encoded,
"_blank"
);

}

</script>
